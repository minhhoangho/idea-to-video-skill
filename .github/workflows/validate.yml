name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in idea-to-video/scripts/*.sh install.sh scripts/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Scripts are executable
        run: |
          for f in idea-to-video/scripts/*.sh install.sh scripts/*.sh; do
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          t = pathlib.Path('idea-to-video/SKILL.md').read_text()
          if not t.startswith('---'):
              sys.exit('SKILL.md must open with YAML frontmatter')
          fm = t.split('---')[1]
          name = re.search(r'^name:\s*(.+)$', fm, re.M)
          desc = re.search(r'^description:\s*(.+)$', fm, re.M)
          if not name or not desc:
              sys.exit('frontmatter needs both name and description')
          if name.group(1).strip() != 'idea-to-video':
              sys.exit('name must match the directory name')
          if len(desc.group(1)) < 80:
              sys.exit('description too thin to trigger reliably')
          print('frontmatter ok')
          PY

      - name: Referenced files exist
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('idea-to-video')
          text = '\n'.join(p.read_text() for p in root.rglob('*.md'))
          missing = []
          for rel in set(re.findall(r'`((?:references|assets|scripts)/[\w./-]+)`', text)):
              if not (root / rel).exists():
                  missing.append(rel)
          if missing:
              sys.exit('referenced but missing: ' + ', '.join(sorted(missing)))
          print('all internal references resolve')
          PY

      - name: Workspace scripts run end to end
        run: |
          chmod +x idea-to-video/scripts/*.sh
          cd "$(mktemp -d)"
          JOB=$("$GITHUB_WORKSPACE"/idea-to-video/scripts/new_project.sh ci-test 2>/dev/null)
          test -f "$JOB/brief.md" || { echo "brief.md not seeded"; exit 1; }
          test -f "$JOB/NOTES.md" || { echo "NOTES.md not created"; exit 1; }
          grep -q ci-test video-projects/INDEX.md || { echo "job not registered"; exit 1; }
          test -d "$JOB/input" || { echo "input/ not created"; exit 1; }
          echo "workspace scripts ok"

      - name: Input scan reports what is there
        run: |
          # The runner image does not guarantee ffmpeg, and scan_input.sh reports
          # image dimensions through ffprobe — install it rather than test the
          # degraded path.
          command -v ffprobe >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          cd "$(mktemp -d)"
          JOB=$("$GITHUB_WORKSPACE"/idea-to-video/scripts/new_project.sh scan-test 2>/dev/null)
          SCAN="$GITHUB_WORKSPACE/idea-to-video/scripts/scan_input.sh"
          # An empty folder is a normal state, not an error.
          "$SCAN" "$JOB" | grep -q 'input/ is empty' || { echo "empty input/ not reported"; exit 1; }
          ffmpeg -v error -y -f lavfi -i color=c=red:s=200x200 -frames:v 1 "$JOB/input/logo small.png"
          ffmpeg -v error -y -f lavfi -i color=c=blue:s=1080x1920 -frames:v 1 "$JOB/input/hero.png"
          printf 'a\nb\n' > "$JOB/input/notes.txt"
          : > "$JOB/input/mockup.psd"
          OUT="$("$SCAN" "$JOB" --target 1080x1920)"
          echo "$OUT"
          # A filename with a space must survive, and the undersized image must be flagged.
          echo "$OUT" | grep -q 'logo small.png' || { echo "spaced filename lost"; exit 1; }
          echo "$OUT" | grep -q 'tiny' || { echo "undersized image not flagged"; exit 1; }
          echo "$OUT" | grep -q 'full-frame capable' || { echo "full-size image not recognised"; exit 1; }
          echo "$OUT" | grep -q 'cannot be read' || { echo "unopenable file not flagged"; exit 1; }
          echo "$OUT" | grep -q '4 file(s)' || { echo "wrong file count"; exit 1; }
          # input/ is the user's: the scan must not have touched it.
          test -f "$JOB/input/mockup.psd" || { echo "scan modified input/"; exit 1; }
          echo "input scan ok"

      - name: Python env script is idempotent
        run: |
          cd "$(mktemp -d)"
          git init -q .
          printf 'node_modules/' > .gitignore   # no trailing newline, on purpose
          "$GITHUB_WORKSPACE"/idea-to-video/scripts/setup_python_env.sh tabulate
          test -x .venv/bin/python || { echo "venv not created"; exit 1; }
          .venv/bin/python -c 'import ssl' || { echo "venv has no working ssl"; exit 1; }
          grep -qx '.venv/' .gitignore || { echo ".venv/ not gitignored"; exit 1; }
          grep -qx 'node_modules/' .gitignore || { echo "clobbered existing .gitignore line"; exit 1; }
          # A rerun must reuse the venv and install nothing.
          "$GITHUB_WORKSPACE"/idea-to-video/scripts/setup_python_env.sh tabulate 2>&1 | grep -q 'nothing to install' \
            || { echo "rerun did not short-circuit"; exit 1; }
          test "$(grep -c '^\.venv/$' .gitignore)" = 1 || { echo ".gitignore entry duplicated"; exit 1; }
          echo "python env script ok"

      - name: Remotion index is complete
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          d = pathlib.Path('idea-to-video/references/remotion')
          idx = (d / 'INDEX.md').read_text()
          linked = set(re.findall(r'\]\(([\w./-]+\.md)\)', idx))
          present = {p.name for p in d.glob('*.md')} - {'INDEX.md'}
          broken = sorted(l for l in linked if not (d / l).exists())
          orphan = sorted(present - linked)
          if broken:
              sys.exit('broken links in INDEX.md: ' + ', '.join(broken))
          if orphan:
              sys.exit('files missing from INDEX.md: ' + ', '.join(orphan))
          print(f'{len(present)} topic files, all indexed')
          PY

      - name: No API keys anywhere in the skill
        run: |
          # The skill's defining constraint. A reference file that quietly
          # reintroduces a credential prompt is a regression, not a feature.
          if grep -rniE '(api[_-]?key|secret[_-]?key|access[_-]?token)[[:space:]]*=' \
               idea-to-video/ ; then
            echo "a credential assignment appeared in the skill"; exit 1
          fi
          echo "no credential assignments"

      - name: Component library typechecks
        run: |
          # These .tsx files ship as source and have no other test. A scaffold
          # plus tsc is the only thing that catches a broken one before a user
          # hits it mid-render.
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE"/idea-to-video/scripts/scaffold_remotion.sh ci 1080 1920 30 ./project
          cd project
          npm install --silent --no-audit --no-fund
          mkdir -p src/scenes
          cat > src/scenes/CiDemo.tsx <<'TSX'
          import React from 'react';
          import {
            Scene, WipeIn, Backdrop, HeroTitle, KineticLines, StatCounter, BulletList,
            ProcessSteps, ComparisonPair, Caption, MediaPlate, DeviceFrame, LogoLockup,
            Reveal, Stagger, KenBurns, Breathe, Grain, Vignette, Grade, SafeArea,
          } from '../components';

          export const CiDemo: React.FC = () => (
            <Scene media={<MediaPlate src="images/hero.jpg" />} backdrop={<Backdrop />}>
              <WipeIn />
              <HeroTitle align="center">Title</HeroTitle>
              <KineticLines lines={['one', 'two *three*']} at={10} />
              <StatCounter to={98.5} decimals={1} suffix="%" label="retained" at={20} />
              <BulletList items={['a', 'b']} marker="number" at={30} />
              <ProcessSteps steps={[{ title: 'Write' }, { title: 'Speak', detail: 'tts' }]} at={40} />
              <ComparisonPair left={{ label: 'Before', body: 'x' }} right={{ label: 'After', body: 'y' }} at={50} />
              <DeviceFrame src="images/app.png" at={60} />
              <LogoLockup src="images/logo.svg" wordmark="Brand" cta="Get it" at={70} />
              <Reveal at={5} exitAt={80} preset="bouncy"><span>r</span></Reveal>
              <Stagger at={5}><span>a</span><span>b</span></Stagger>
              <KenBurns to={1.2} drift={[10, -20]}><span>k</span></KenBurns>
              <Breathe><span>b</span></Breathe>
              <SafeArea><span>s</span></SafeArea>
              <Grade /><Vignette /><Grain />
              <Caption at={5}>caption</Caption>
            </Scene>
          );
          TSX
          npx tsc --noEmit
          echo "component library typechecks"

      - name: Build bundle
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: idea-to-video-skill
          path: dist/idea-to-video.skill
